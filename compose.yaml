# V35 first-run database bootstrap (Docker variant). Port 3307 on the host
# deliberately avoids clashing with an existing local XAMPP MariaDB on the
# default 3306 — both can run side by side. Image and healthcheck mirror
# `.github/workflows/ci.yml`'s `catalog-database` service exactly, so a
# passing CI run is good evidence this container will behave the same way.
#
# Credentials come only from `.env` (see `.env.example`) — never committed
# here, and `MARIADB_ROOT_PASSWORD`/`MARIADB_PASSWORD` have no built-in
# default on purpose, so `docker compose up` fails loudly instead of
# starting with a guessable password.
services:
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    ports:
      - '${MARIADB_HOST_PORT:-3307}:3306'
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-cieslacalc}
      MARIADB_USER: ${MARIADB_USER:-catalog_user}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - cieslacalc-mariadb:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  cieslacalc-mariadb:
