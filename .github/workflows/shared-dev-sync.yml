name: Shared DEV deployed verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: shared-dev
    env:
      ROOFCALC_DEV_APP_URL: ${{ vars.ROOFCALC_DEV_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify independently deployed Worker (read only)
        run: node tools/verify-shared-dev.mjs
